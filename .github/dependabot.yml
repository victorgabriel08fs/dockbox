# Mantém atualizados os hashes das GitHub Actions e os pacotes NuGet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    groups:
      testes:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
