name: release

# Roda ao enviar uma tag de versão (git tag vX.Y.Z && git push origin vX.Y.Z) ou ao
# criar a release pelo site. Também dá para rodar à mão em Actions > release >
# Run workflow, informando uma tag que já existe.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.1.0)'
        required: true

# contents: write para criar a release e enviar o branch com o zip;
# pull-requests: write para abrir o PR desse branch. Nada além disso.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Ler versão da tag
        id: ver
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # Se o zip desta versão já está commitado em releases/ (na tag ou na main),
          # usa ele em vez de recompilar, para a release e a pasta terem o mesmo arquivo.
          if [ ! -f "releases/$tag/Dockbox-$tag-win-x64.zip" ] \
             && git fetch --depth=1 origin main 2>/dev/null \
             && git cat-file -e "FETCH_HEAD:releases/$tag/Dockbox-$tag-win-x64.zip" 2>/dev/null; then
            git checkout FETCH_HEAD -- "releases/$tag"
          fi
          if [ -f "releases/$tag/Dockbox-$tag-win-x64.zip" ]; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar executável único
        if: steps.ver.outputs.prebuilt != 'true'
        run: dotnet publish src/Dockbox/Dockbox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.ver.outputs.version }} -o out

      - name: Empacotar zip
        if: steps.ver.outputs.prebuilt != 'true'
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          mkdir -p "releases/$tag"
          zip="Dockbox-$tag-win-x64.zip"
          (cd out && 7z a -tzip -mx=9 "../releases/$tag/$zip" Dockbox.exe)
          (cd "releases/$tag" && sha256sum "$zip" > SHA256SUMS.txt)

      - name: Notas da versão a partir do CHANGELOG
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[.*\]: / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Veja o CHANGELOG.md." > notes.md

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          files=("releases/$tag/Dockbox-$tag-win-x64.zip" "releases/$tag/SHA256SUMS.txt")
          # Se a release já foi criada pela página Releases do GitHub, anexa os arquivos
          # e, se ela ficou sem descrição, preenche título e notas a partir do CHANGELOG.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            if [ -z "$(gh release view "$tag" --json body -q .body | tr -d '[:space:]')" ]; then
              gh release edit "$tag" --title "Dockbox $tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" "${files[@]}" --title "Dockbox $tag" --notes-file notes.md
          fi

      # Precisa da opção "Allow GitHub Actions to create and approve pull requests"
      # em Settings > Actions > General. Sem ela, a release é criada mesmo assim.
      - name: Abrir PR com o zip na pasta releases/
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git fetch origin main
          if git ls-tree -d --name-only origin/main "releases/$tag" | grep -q .; then
            echo "releases/$tag já está na main"; exit 0
          fi
          branch="release-files/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          git add "releases/$tag"
          git commit -m "Adiciona executável da $tag em releases/"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Adiciona executável da $tag em releases/" \
            --body "Zip gerado pelo workflow release a partir da tag $tag. Lembre de atualizar a tabela em releases/README.md."
