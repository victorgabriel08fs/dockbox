<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Dockbox</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="0.55" stop-color="#2F6BF5"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1A1060" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#gloss)"/>

  <g transform="translate(0,-84)">
  <!-- Prateleira do Dock (vidro) -->
  <rect x="150" y="600" width="724" height="190" rx="64" fill="url(#shelf)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="6"/>

  <!-- Ícones, o do meio ampliado como no Dock do macOS -->
  <g filter="url(#shadow)">
    <rect x="199" y="566" width="160" height="160" rx="44" fill="url(#tile)" opacity="0.9"/>
    <rect x="382" y="466" width="260" height="260" rx="70" fill="url(#tile)"/>
    <rect x="665" y="566" width="160" height="160" rx="44" fill="url(#tile)" opacity="0.9"/>
  </g>

  <!-- Ponto de app aberto -->
  <circle cx="512" cy="760" r="14" fill="#FFFFFF"/>
  </g>
</svg>
