<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Dockbox (16 a 32 px)</title>
  <!-- Versão simplificada para tamanhos pequenos: formas alinhadas à grade de 16 px (64 unidades = 1 px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="0.55" stop-color="#2F6BF5"/>
      <stop offset="1" stop-color="#5B3FD9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="64" y="576" width="896" height="256" rx="96" fill="#FFFFFF" fill-opacity="0.38"/>
  <rect x="128" y="448" width="192" height="256" rx="48" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="384" y="320" width="256" height="384" rx="64" fill="#FFFFFF"/>
  <rect x="704" y="448" width="192" height="256" rx="48" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
